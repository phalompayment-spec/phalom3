# Local development without Workers AI (that binding always runs remotely). Used by `npm run dev`.
name = "phalom"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/pay/*", "/shop/*"]


[vars]
# The tourist demo app (tourist/). Payment and shop QR codes open there.
TOURIST_URL = "http://127.0.0.1:8788"

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, WEBHOOK_SECRET (optional)
