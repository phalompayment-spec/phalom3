name = "phalom"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/pay/*", "/shop/*"]

# Workers AI: auto-translates Lao shop and menu names (zh, th, vi, en).
[ai]
binding = "AI"

[vars]
# The tourist demo app (tourist/). Payment and shop QR codes open there.
TOURIST_URL = "https://phalom-tourist.phalom-payment.workers.dev"

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, WEBHOOK_SECRET (optional)
