<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ຈ່າຍເງິນໃນລາວ · Phalom</title>
  <meta name="description" content="Sabaidee! Pay any Lao shop with the wallet you already use. Demo.">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#FBF5EA">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&family=Noto+Sans+Lao+Looped:wght@700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/lao.css">
  <style>
    .t-hero { position: relative; }
    .t-hero .hi { position: relative; margin: -34px 16px 0; padding: 14px 18px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
    .t-hero .hi .lo { font-family: var(--font-display); font-size: 34px; line-height: 1.1; color: var(--indigo-d); }
    .t-hero .hi .en { font-weight: 800; font-size: 15px; color: var(--red); letter-spacing: .02em; }
    .langs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 0; scrollbar-width: none; }
    .langs::-webkit-scrollbar { display: none; }
    .card-x { margin: 14px 16px 0; padding: 16px; }
    .wgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .wbtn { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; background: var(--paper); font-size: 12.5px; font-weight: 700; box-shadow: inset 0 0 0 1.5px transparent; }
    .wbtn.on { background: var(--indigo-50); box-shadow: inset 0 0 0 2px var(--indigo); }
    .h3 { margin: 22px 20px 10px; font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .h3::before { content: ""; width: 10px; height: 10px; transform: rotate(45deg); background: var(--gold); border-radius: 2px; }
    .shop { display: flex; gap: 12px; align-items: center; padding: 12px 14px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--paper-2); }
    .shop:last-child { border-bottom: 0; }
    .shop .ic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; flex: none; }
    .shop b { display: block; font-size: 15.5px; }
    .shop .lo { font-size: 13px; color: var(--ink-3); font-weight: 600; }
    .phr { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 4px; scrollbar-width: none; }
    .phr::-webkit-scrollbar { display: none; }
    .phr > div { flex: none; width: 150px; padding: 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .phr > div::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--sinh) repeat-x center / auto 6px; }
    .phr .l { font-size: 20px; font-weight: 800; color: var(--indigo-d); }
    .phr .r { font-weight: 700; font-size: 13px; color: var(--red); }
    .phr .m { font-size: 12.5px; color: var(--ink-2); }
    .pay { padding: 14px 16px calc(24px + var(--safe-b)); }
    .bill { text-align: center; padding: 22px 18px 18px; border-radius: 28px; background: var(--card); box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
    .bill .sicon { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; margin: 0 auto 8px; }
    .bill h2 { margin: 0; font-size: 21px; }
    .bill .lo { color: var(--ink-3); font-weight: 600; font-size: 14px; }
    .bill .amt { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin: 16px 0 4px; }
    .bill .amt .num { font-size: 46px; font-weight: 700; color: var(--indigo-d); }
    .bill .amt .cur { font-size: 20px; font-weight: 800; color: var(--gold-d); }
    .note { display: flex; gap: 10px; align-items: flex-start; text-align: left; margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--gold-50); color: #6B4E10; font-size: 13.5px; font-weight: 600; }
    .note .g { flex: none; margin-top: 1px; }
    .route { display: flex; align-items: center; justify-content: space-between; margin: 20px 4px 6px; }
    .route .st { display: grid; justify-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); width: 80px; text-align: center; }
    .route .st .ic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; background: var(--paper-2); color: var(--ink-3); transition: all .3s; }
    .route .st.on { color: var(--ink); } .route .st.on .ic { background: var(--indigo); color: #fff; transform: scale(1.06); box-shadow: 0 8px 18px -8px rgba(36,48,122,.8); }
    .route .ln { flex: 1; height: 3px; border-radius: 3px; background: var(--paper-3); position: relative; overflow: hidden; margin-bottom: 22px; }
    .route .ln i { position: absolute; inset: 0; background: linear-gradient(90deg, var(--gold), var(--red)); transform: scaleX(0); transform-origin: left; transition: transform .6s ease; }
    .route .ln.on i { transform: scaleX(1); }
    .done-t { text-align: center; padding: 24px 16px calc(24px + var(--safe-b)); min-height: 100dvh; background: radial-gradient(120% 55% at 50% 0%, var(--jade-50), var(--paper) 70%); }
    .done-t > svg { margin: 0 auto; }
    .done-t .kj { font-family: var(--font-display); font-size: 40px; color: var(--jade); line-height: 1.1; margin-top: 8px; }
    .rc { text-align: left; margin-top: 18px; padding: 4px 16px; }
    .rc .r { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: 14.5px; }
    .rc .r:last-child { border-bottom: 0; }
    .rc .r span { color: var(--ink-2); font-weight: 600; } .rc .r b { text-align: right; display: flex; align-items: center; gap: 6px; }
    .items { display: grid; gap: 10px; margin: 14px 16px 0; }
    .it { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); text-align: left; width: 100%; }
    .it .sw { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none; position: relative; overflow: hidden; }
    .it .sw::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--sinh) repeat-x center / auto 6px; }
    .it b { display: block; font-size: 14.5px; line-height: 1.35; }
    .it .lo { font-size: 12.5px; color: var(--ink-3); }
    .it .p { font-family: var(--font-num); font-weight: 700; color: var(--indigo); white-space: nowrap; }
    .it .q { min-width: 30px; height: 30px; border-radius: 99px; background: var(--gold); color: #2A1C00; font-weight: 800; display: grid; place-items: center; font-family: var(--font-num); }
    .bar { position: sticky; bottom: 0; padding: 12px 16px calc(14px + var(--safe-b)); background: linear-gradient(transparent, var(--paper) 30%); }
    .top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; }
    .top a { text-decoration: none; }
    .scan-v { position: fixed; inset: 0; z-index: 90; background: #0b0d1c; display: grid; place-items: center; }
    .scan-v video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .scan-v .win { position: relative; width: 70vw; max-width: 300px; aspect-ratio: 1; }
    .scan-v .win span { position: absolute; width: 50px; height: 50px; }
    .scan-v .x { position: absolute; top: 16px; right: 16px; color: #fff; background: rgba(255,255,255,.15); }
    .scan-v .msg { position: absolute; bottom: 40px; left: 20px; right: 20px; color: #fff; text-align: center; font-weight: 700; }
    .map-cta { display: flex; align-items: center; gap: 14px; margin: 14px 16px 0; padding: 14px 16px; border-radius: 22px; text-decoration: none; color: #fff; position: relative; overflow: hidden;
      background: var(--scales), radial-gradient(110% 120% at 100% 0%, #2FA57E 0%, transparent 55%), linear-gradient(150deg, #24307A, #161F57); box-shadow: var(--shadow-lg); }
    .map-cta .mc-ic { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.14); display: grid; place-items: center; }
    .map-cta b { display: block; font-size: 17px; } .map-cta span { font-size: 13px; color: #D9DDF5; font-weight: 600; }
    .map-cta .mc-pin { color: var(--gold-l); animation: float 3s ease-in-out infinite; }
    .map-wrap { position: relative; height: min(46vh, 340px); margin: 4px 16px 0; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-lg); background: var(--paper-2); scroll-margin-top: 10px; }
    .gmap { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .map-tag { position: absolute; left: 10px; bottom: 10px; right: 64px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; background: rgba(255,253,248,.96); box-shadow: var(--shadow); font-size: 13.5px; pointer-events: none; }
    .map-tag b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .map-tag span { font-family: var(--font-num); color: var(--ink-2); font-weight: 600; }
    .map-tools { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 0; scrollbar-width: none; } .map-tools::-webkit-scrollbar { display: none; }
    #near { background: var(--jade); color: #fff; box-shadow: none; }
    .why { margin: -4px 20px 10px; font-size: 13px; color: var(--ink-2); font-weight: 600; display: flex; gap: 6px; align-items: flex-start; } .why svg { margin-top: 2px; }
    .recs { display: grid; gap: 12px; margin: 0 16px; }
    .rec { padding: 14px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); cursor: pointer; transition: box-shadow .2s, transform .2s; }
    .rec.on { box-shadow: inset 0 0 0 2.5px var(--indigo), var(--shadow-lg); }
    .rec-top { display: flex; gap: 12px; align-items: center; }
    .rec .rank { position: relative; isolation: isolate; width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; color: var(--gold-d); flex: none; }
    .rec .rank::before { content: ""; position: absolute; inset: 5px; transform: rotate(45deg); border-radius: 6px; background: var(--gold-50); z-index: -1; }
    .rec.on .rank { color: #2A1C00; } .rec.on .rank::before { background: var(--gold); }
    .rec .ic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; flex: none; }
    .rec b { display: block; font-size: 15.5px; line-height: 1.35; } .rec .lo { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
    .rec .meta { font-size: 12.5px; color: var(--ink-2); font-weight: 600; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
    .rchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .rchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; }
    .rec-act { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; } .rec-act .btn { min-height: 44px; font-size: 14.5px; padding: 0 10px; border-radius: 14px; }
    .walk { margin: 16px 16px 0; padding: 16px; border-radius: 22px; background: linear-gradient(160deg, #FFF6E2, #FBEBC8); box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .walk::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--sinh) repeat-x center / auto 6px; }
    .walk-h { display: flex; gap: 12px; align-items: center; color: var(--gold-d); } .walk-h b { display: block; color: var(--ink); font-size: 16px; } .walk-h span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .walk-stops { list-style: none; margin: 12px 0 14px; padding: 0; display: grid; gap: 0; counter-reset: s; }
    .walk-stops li { display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 6px; position: relative; font-size: 14px; }
    .walk-stops li + li::before { content: ""; position: absolute; left: 19px; top: -8px; height: 14px; border-left: 2px dashed var(--gold); }
    .walk-stops .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; }
    a.btn { text-decoration: none; } a.btn-ghost { color: var(--indigo); }
  </style>
