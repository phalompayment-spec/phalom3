<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phalom</title>
<style>
  :root{--khram:#1F2B6B;--silk:#D99A1E;--ink:#151A33;--ink-2:#4A5070;--ink-3:#7C819C;--line:#E2E4EE;--paper:#FFFFFF;--ground:#EEF0F6;--warn-bg:#FBF1DC;--warn:#8A5A00;color-scheme:light}
  @media (prefers-color-scheme: dark){:root{--khram:#8FA0F0;--ink:#ECEEF8;--ink-2:#B4B9D2;--ink-3:#868CA8;--line:#2B3150;--paper:#141936;--ground:#0E1229;--warn-bg:#3A2E14;--warn:#F0B847;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);font-family:"Noto Sans Lao","Phetsarath OT",system-ui,sans-serif;font-size:16px;line-height:1.55}
  main{max-width:440px;margin:0 auto;padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo b{font-size:22px;color:var(--khram)}
  h1{font-size:24px;line-height:1.3;margin:8px 0 0}
  p{margin:0;color:var(--ink-2)}
  .card{background:var(--paper);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
  label{font-weight:600;font-size:14px}
  input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
  button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px;cursor:pointer}
  .cta{background:#1F2B6B;color:#fff}
  .ghost{background:transparent;color:var(--khram);border:1px solid var(--line)}
  .or{text-align:center;color:var(--ink-3);font-size:13px}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
  .hint{font-size:13px;color:var(--ink-3)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg width="44" height="44" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1F2B6B"/><path d="M256 66 446 256 256 446 66 256Z" fill="#2E3D8C"/><path d="M256 126 386 256 256 386 126 256Z" fill="#3A4AA8"/><path d="M256 184 328 256 256 328 184 256Z" fill="#D99A1E"/><path d="M256 216v80M216 256h80" stroke="#1F2B6B" stroke-width="12" stroke-linecap="round"/></svg>
    <b>Phalom</b>
  </div>
  <h1>ເຊື່ອມຕໍ່ຮ້ານຂອງທ່ານ</h1>
  <p>ນັກທ່ອງທ່ຽວຈ່າຍແບບບ້ານເຂົາ, ແມ່ຄ້າຮັບເງິນກີບແບບບ້ານເຮົາ</p>

  <div class="warn" id="offline" hidden>
    <span>ເຊື່ອມຕໍ່ເຊີບເວີບໍ່ໄດ້. ກວດເບິ່ງອິນເຕີເນັດ ຫຼື ທີ່ຢູ່ເຊີບເວີ ແລ້ວລອງໃໝ່.</span>
    <button class="cta" type="button" id="retry">ລອງໃໝ່</button>
  </div>

  <form class="card" id="f">
    <label for="url">ທີ່ຢູ່ເຊີບເວີ Phalom</label>
    <input id="url" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="https://phalom.xxxx.workers.dev" required>
    <p class="hint">ລິ້ງທີ່ໄດ້ຈາກການ deploy ເທິງ Cloudflare</p>
    <button class="cta" type="submit">ເຊື່ອມຕໍ່</button>
  </form>

  <div class="or">ຫຼື</div>
  <button class="ghost" type="button" id="demo">ລອງໂໝດສາທິດ (ບໍ່ຕ້ອງມີເຊີບເວີ)</button>
  <p class="hint">ໂໝດສາທິດໃຊ້ຂໍ້ມູນຕົວຢ່າງໃນເຄື່ອງ ແລະ ບໍ່ມີເງິນແທ້.</p>
</main>
<script>
(function () {
  var A = window.PhalomAndroid;
  var url = document.getElementById("url");
  try { if (A) url.value = A.getServer() || ""; } catch (e) {}
  document.getElementById("offline").hidden = location.hash !== "#offline" || !url.value;
  document.getElementById("retry").onclick = function () { if (A) A.retry(); };
  document.getElementById("f").onsubmit = function (e) { e.preventDefault(); if (A) A.setServer(url.value); };
  document.getElementById("demo").onclick = function () { if (A) A.useDemo(); else location.href = "demo/index.html"; };
})();
</script>
</body>
</html>
